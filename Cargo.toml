[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["dev/fuzz"]
default-members = ["crates/interplanetary-sdk"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
version = "0.0.1"
authors = ["geoffsee"]
repository = "https://github.com/geoffsee/interplanetary-sdk"

[workspace.dependencies]
ciborium = "0.2"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
aes-kw = "0.2"
typenum = "1.17"
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }
serde = { version = "1.0.200", features = ["derive"] }
hex = "0.4"
serde_json = "1.0"
proptest = "1.5"
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

interplanetary-types = { path = "crates/interplanetary-types" }
interplanetary-bp = { path = "crates/interplanetary-bp" }
interplanetary-security = { path = "crates/interplanetary-security" }
interplanetary-contacts = { path = "crates/interplanetary-contacts" }
interplanetary-routing = { path = "crates/interplanetary-routing" }
interplanetary-store = { path = "crates/interplanetary-store" }
interplanetary-cla = { path = "crates/interplanetary-cla" }
interplanetary-bpa = { path = "crates/interplanetary-bpa" }
interplanetary-tcpcl = { path = "crates/interplanetary-tcpcl" }
interplanetary-sim = { path = "crates/interplanetary-sim" }
interplanetary-tiptop = { path = "crates/interplanetary-tiptop" }
interplanetary-sdk-sync = { path = "crates/interplanetary-sdk-sync" }
interplanetary-sdk-async = { path = "crates/interplanetary-sdk-async" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[profile.bench]
inherits = "release"
